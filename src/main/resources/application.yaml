spring:
  application:
    name: user-service
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/socialapp_users

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/